name: Client CI

on:
  push:
    branches: [dev]
  # pull_request:
  #   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm" # enables automatic node_modules caching for pnpm

      - name: 🧩 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # or 10 if you're feeling spicy
          cache: true # enables .pnpm-store caching

      - name: 🔍 Verify pnpm installation
        run: pnpm -v

      # Since pnpm/action-setup ran install already, we skip manually running pnpm install

      - name: 🧹 Lint
        run: pnpm lint

      - name: ✅ Type Check
        run: pnpm typecheck

      - name: 🛠️ Build
        run: pnpm build
