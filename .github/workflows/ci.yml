name: Client CI

on: [push]

# on:
#   push:
#     branches: [dev]
#   # pull_request:
#   #   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Optional: Copy .env.example files into .env (if needed)
      # - name: Copy .env.example files
      #   shell: bash
      #   run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;

      - name: Prettier Check
        run: bun format --check

      - name: ESLint Check
        run: bun lint

      - name: TypeScript Typecheck
        run: bun typecheck

      - name: Run Code Quality Check
        run: bun check

      - name: Build project
        run: bun run build

      - name: Preview Build Output
        if: success()
        run: |
          echo "✅ Build completed successfully"
          ls -la .output || ls -la dist || echo "No output folder found"

  # Optional: Run your dev server smoke test (ensures it boots)
  smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start server (test)
        run: bun dev &

      - name: Wait for server
        run: bunx wait-on http://localhost:3000

      - name: Stop server
        run: |
          pids=$(lsof -t -i:3000)
          if [ -n "$pids" ]; then
            kill $pids
          fi
