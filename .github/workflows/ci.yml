name: Client CI

on:
  push:
    branches: [dev]
  # pull_request:
  #   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js + Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm" # this enables automatic node_modules caching

      - name: 🧩 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # or 10 if you're on latest
          run_install: false # we will run install ourselves

      - name: 🔍 Verify pnpm installation
        run: pnpm -v

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧹 Lint
        run: pnpm lint

      - name: ✅ Type Check
        run: pnpm typecheck

      - name: 🛠️ Build
        run: pnpm build
